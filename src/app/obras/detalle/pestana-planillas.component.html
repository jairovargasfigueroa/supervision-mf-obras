@if (puedeCrear()) {
  <div class="herramientas">
    <a mat-flat-button routerLink="planillas/nueva">
      <mat-icon fontSet="material-symbols-outlined">add</mat-icon>
      Nueva planilla
    </a>
  </div>
}
@if (estado() === 'cargando') {
  <p class="cargando">Cargando planillas…</p>
} @else if (estado() === 'error') {
  <app-estado-error (reintentar)="cargar()" />
} @else if (planillas().length === 0) {
  <app-estado-vacio texto="Aún no hay planillas." icono="request_quote" />
} @else {
  <div class="tabla">
    <table mat-table [dataSource]="planillas()">
      <ng-container matColumnDef="numero">
        <th mat-header-cell *matHeaderCellDef>N.º</th>
        <td mat-cell *matCellDef="let planilla" class="sv-numero">{{ planilla.numero }}</td>
      </ng-container>
      <ng-container matColumnDef="periodo">
        <th mat-header-cell *matHeaderCellDef>Periodo</th>
        <td mat-cell *matCellDef="let planilla">{{ nombrePeriodo(planilla.periodo) }}</td>
      </ng-container>
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let planilla"><app-estado-chip [estado]="planilla.estado" /></td>
      </ng-container>
      <ng-container matColumnDef="neto">
        <th mat-header-cell *matHeaderCellDef class="numero">Neto</th>
        <td mat-cell *matCellDef="let planilla" class="numero sv-numero">{{ monto(planilla.neto) }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let fila; columns: columnas"></tr>
    </table>
  </div>
}
